name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Structure checks
        run: python3 scripts/validate.py
      - name: Content changes carry a version bump
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate.py --base "origin/${{ github.base_ref }}"
